<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Save and refresh cycle</title><desc id="d">A four-step cycle shows edit code, save file, refresh browser, and check the updated page.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:18px}.a{stroke:#52739b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1000" height="470" rx="22" fill="#f7f9fc"/><text x="500" y="55" text-anchor="middle" class="h">The save-and-preview cycle</text><g><rect x="100" y="125" width="330" height="105" rx="15" fill="#eaf2fb" stroke="#52739b" stroke-width="3"/><text x="265" y="168" text-anchor="middle" class="l">1. Edit code</text><text x="265" y="200" text-anchor="middle" class="s">Make a small change</text><rect x="570" y="125" width="330" height="105" rx="15" fill="#fff3e8" stroke="#c27a39" stroke-width="3"/><text x="735" y="168" text-anchor="middle" class="l">2. Save file</text><text x="735" y="200" text-anchor="middle" class="s">Save in VS Code</text><rect x="570" y="295" width="330" height="105" rx="15" fill="#e8f1e9" stroke="#43815a" stroke-width="3"/><text x="735" y="338" text-anchor="middle" class="l">3. Refresh browser</text><text x="735" y="370" text-anchor="middle" class="s">Reload the page</text><rect x="100" y="295" width="330" height="105" rx="15" fill="#edf0f5" stroke="#7b8795" stroke-width="3"/><text x="265" y="338" text-anchor="middle" class="l">4. Check the page</text><text x="265" y="370" text-anchor="middle" class="s">Look for your change</text></g><g class="a"><path d="M430 178 H560 l-12 -10 m12 10 l-12 10"/><path d="M735 230 V285 l-10 -12 m10 12 l10 -12"/><path d="M570 348 H440 l12 -10 m-12 10 l12 10"/><path d="M265 295 V240 l-10 12 m10 -12 l10 12"/></g><text x="500" y="445" text-anchor="middle" class="s">If the result is wrong, check the file, save again, and preview again.</text></svg>