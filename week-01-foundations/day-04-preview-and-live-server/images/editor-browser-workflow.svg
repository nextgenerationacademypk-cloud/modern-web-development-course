<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="t d"><title id="t">Editor to browser workflow</title><desc id="d">A simple process shows writing HTML in VS Code, saving the file, and viewing it in a web browser.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:18px}.a{stroke:#52739b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1000" height="460" rx="22" fill="#f7f9fc"/><text x="500" y="55" text-anchor="middle" class="h">From code to webpage</text><rect x="70" y="145" width="245" height="165" rx="18" fill="#eaf2fb" stroke="#52739b" stroke-width="3"/><text x="192" y="205" text-anchor="middle" class="l">1. VS Code</text><text x="192" y="245" text-anchor="middle" class="s">Write HTML code</text><text x="192" y="275" text-anchor="middle" class="s">in your file</text><rect x="380" y="145" width="245" height="165" rx="18" fill="#fff3e8" stroke="#c27a39" stroke-width="3"/><text x="502" y="205" text-anchor="middle" class="l">2. Save</text><text x="502" y="245" text-anchor="middle" class="s">Save your</text><text x="502" y="275" text-anchor="middle" class="s">HTML file</text><rect x="690" y="145" width="245" height="165" rx="18" fill="#e8f1e9" stroke="#43815a" stroke-width="3"/><text x="812" y="205" text-anchor="middle" class="l">3. Browser</text><text x="812" y="245" text-anchor="middle" class="s">View the</text><text x="812" y="275" text-anchor="middle" class="s">webpage</text><g class="a"><path d="M315 225 H370 l-12 -10 m12 10 l-12 10"/><path d="M625 225 H680 l-12 -10 m12 10 l-12 10"/></g><text x="500" y="380" text-anchor="middle" class="s">Change code → Save → Refresh or let Live Server update the preview</text></svg>