<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Common sections of a webpage</title><desc id="desc">A simple website wireframe labels header, navigation, main content, optional sidebar and footer.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:17px}.call{stroke:#bd5b22;stroke-width:3;fill:none;stroke-linecap:round}</style></defs>
<rect width="1100" height="650" rx="24" fill="#f7f9fc"/><text x="550" y="52" text-anchor="middle" class="h">Common sections of a webpage</text>
<rect x="180" y="105" width="740" height="455" rx="16" fill="#fff" stroke="#526b89" stroke-width="3"/>
<rect x="205" y="130" width="690" height="75" rx="8" fill="#dce8f5"/><text x="550" y="175" text-anchor="middle" class="l">HEADER — logo or website name</text>
<rect x="205" y="220" width="690" height="55" rx="8" fill="#e8f1e9"/><text x="550" y="255" text-anchor="middle" class="l">NAVIGATION — links to pages</text>
<rect x="205" y="290" width="455" height="190" rx="8" fill="#edf4fc"/><text x="432" y="365" text-anchor="middle" class="l">MAIN CONTENT</text><text x="432" y="400" text-anchor="middle" class="s">Important page information</text>
<rect x="675" y="290" width="220" height="190" rx="8" fill="#fff3e8" stroke="#d6a16e" stroke-width="2"/><text x="785" y="370" text-anchor="middle" class="l">SIDEBAR</text><text x="785" y="402" text-anchor="middle" class="s">Optional extra</text>
<rect x="205" y="495" width="690" height="45" rx="8" fill="#e8eaf0"/><text x="550" y="525" text-anchor="middle" class="l">FOOTER — contact details or useful links</text>
<text x="550" y="605" text-anchor="middle" class="s">This is an example layout. Not every website uses every section.</text>
</svg>