<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">The internet and the World Wide Web</title><desc id="desc">The internet connects devices and supports many services. The web is one service that uses the internet.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.heading{font-size:30px;font-weight:700}.sub{font-size:19px}.label{font-size:21px;font-weight:700}.small{font-size:17px}.line{stroke:#52739b;stroke-width:4;fill:none;stroke-linecap:round}.device{fill:#eaf2fb;stroke:#52739b;stroke-width:3}.service{fill:#fff;stroke:#52739b;stroke-width:2.5}
</style></defs>
<rect width="1100" height="620" rx="24" fill="#f7f9fc"/>
<text x="550" y="58" text-anchor="middle" class="heading">The internet connects devices</text>
<rect x="75" y="100" width="950" height="450" rx="30" fill="#edf4fc" stroke="#52739b" stroke-width="4"/>
<text x="550" y="145" text-anchor="middle" class="heading">INTERNET</text>
<g class="line"><path d="M550 175 L220 245 M550 175 L550 245 M550 175 L880 245"/></g>
<g>
<rect class="device" x="125" y="245" width="190" height="105" rx="16"/><text x="220" y="290" text-anchor="middle" class="label">Computer</text><text x="220" y="320" text-anchor="middle" class="small">Device</text>
<rect class="device" x="455" y="245" width="190" height="105" rx="16"/><text x="550" y="290" text-anchor="middle" class="label">Phone</text><text x="550" y="320" text-anchor="middle" class="small">Device</text>
<rect class="device" x="785" y="245" width="190" height="105" rx="16"/><text x="880" y="290" text-anchor="middle" class="label">Web server</text><text x="880" y="320" text-anchor="middle" class="small">Computer</text>
</g>
<path d="M220 350 V390 H880 V350" class="line"/>
<path d="M550 390 V420" class="line"/>
<rect x="345" y="420" width="410" height="85" rx="18" fill="#fff" stroke="#16724b" stroke-width="3"/>
<text x="550" y="455" text-anchor="middle" class="label">The World Wide Web</text>
<text x="550" y="483" text-anchor="middle" class="small">One service that uses the internet</text>
<text x="550" y="585" text-anchor="middle" class="sub">The internet supports other services too, such as email and video calls.</text>
</svg>