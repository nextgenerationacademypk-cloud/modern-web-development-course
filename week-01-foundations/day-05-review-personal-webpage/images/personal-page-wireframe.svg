<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Personal introduction page wireframe</title><desc id="d">A simple page layout with a main heading and three text sections for introduction, interests, and learning goals.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:18px}</style></defs><rect width="1000" height="600" rx="22" fill="#f7f9fc"/><text x="500" y="52" text-anchor="middle" class="h">Personal introduction page</text><rect x="170" y="95" width="660" height="445" rx="18" fill="#fff" stroke="#526b89" stroke-width="3"/><rect x="205" y="130" width="590" height="78" rx="10" fill="#dce8f5"/><text x="500" y="178" text-anchor="middle" class="l">Main heading</text><rect x="205" y="230" width="590" height="78" rx="10" fill="#edf4fc"/><text x="500" y="263" text-anchor="middle" class="l">Introduction</text><text x="500" y="290" text-anchor="middle" class="s">A short paragraph about the student</text><rect x="205" y="325" width="590" height="78" rx="10" fill="#e8f1e9"/><text x="500" y="358" text-anchor="middle" class="l">Interests or hobbies</text><text x="500" y="385" text-anchor="middle" class="s">A paragraph about things they enjoy</text><rect x="205" y="420" width="590" height="78" rx="10" fill="#fff3e8"/><text x="500" y="453" text-anchor="middle" class="l">Learning goals</text><text x="500" y="480" text-anchor="middle" class="s">A paragraph about what they want to learn</text><text x="500" y="575" text-anchor="middle" class="s">A planning guide — students create the page with HTML.</text></svg>