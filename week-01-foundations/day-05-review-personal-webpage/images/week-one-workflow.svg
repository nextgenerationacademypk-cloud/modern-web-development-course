<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Week one webpage workflow</title><desc id="d">Five steps recap the first week: understand the web, organise files, write HTML, preview in browser, and improve the page.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.l{font-size:21px;font-weight:700}.s{font-size:17px}.a{stroke:#52739b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1000" height="470" rx="22" fill="#f7f9fc"/><text x="500" y="55" text-anchor="middle" class="h">Your first webpage: Week 1 workflow</text><g><rect x="35" y="150" width="170" height="145" rx="15" fill="#eaf2fb" stroke="#52739b" stroke-width="2.5"/><text x="120" y="195" text-anchor="middle" class="l">1. Explore</text><text x="120" y="232" text-anchor="middle" class="s">Understand</text><text x="120" y="255" text-anchor="middle" class="s">the web</text><rect x="230" y="150" width="170" height="145" rx="15" fill="#fff3e8" stroke="#c27a39" stroke-width="2.5"/><text x="315" y="195" text-anchor="middle" class="l">2. Organise</text><text x="315" y="232" text-anchor="middle" class="s">Create files</text><text x="315" y="255" text-anchor="middle" class="s">and folders</text><rect x="425" y="150" width="170" height="145" rx="15" fill="#e8f1e9" stroke="#43815a" stroke-width="2.5"/><text x="510" y="195" text-anchor="middle" class="l">3. Write</text><text x="510" y="232" text-anchor="middle" class="s">Build an</text><text x="510" y="255" text-anchor="middle" class="s">HTML page</text><rect x="620" y="150" width="170" height="145" rx="15" fill="#edf0f5" stroke="#7b8795" stroke-width="2.5"/><text x="705" y="195" text-anchor="middle" class="l">4. Preview</text><text x="705" y="232" text-anchor="middle" class="s">Open it in</text><text x="705" y="255" text-anchor="middle" class="s">a browser</text><rect x="815" y="150" width="150" height="145" rx="15" fill="#e8f1e9" stroke="#43815a" stroke-width="2.5"/><text x="890" y="195" text-anchor="middle" class="l">5. Improve</text><text x="890" y="232" text-anchor="middle" class="s">Check and</text><text x="890" y="255" text-anchor="middle" class="s">edit</text></g><g class="a"><path d="M205 222 H222 l-8 -8 m8 8 l-8 8"/><path d="M400 222 H417 l-8 -8 m8 8 l-8 8"/><path d="M595 222 H612 l-8 -8 m8 8 l-8 8"/><path d="M790 222 H807 l-8 -8 m8 8 l-8 8"/></g><text x="500" y="370" text-anchor="middle" class="s">A small, complete webpage is a strong first achievement.</text></svg>