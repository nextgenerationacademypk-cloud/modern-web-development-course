<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d"><title id="t">Basic HTML document structure</title><desc id="d">A nested diagram shows doctype, html, head with title and metadata, and body with heading and paragraph.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.l{font-family:monospace;font-size:21px;font-weight:700}.s{font-size:18px}</style></defs><rect width="1000" height="680" rx="22" fill="#f7f9fc"/><text x="500" y="52" text-anchor="middle" class="h">Basic HTML document structure</text><rect x="80" y="85" width="840" height="48" rx="9" fill="#e8eaf0"/><text x="500" y="116" text-anchor="middle" class="l">&lt;!DOCTYPE html&gt;</text><rect x="80" y="150" width="840" height="485" rx="16" fill="#eaf2fb" stroke="#52739b" stroke-width="3"/><text x="110" y="185" class="l">&lt;html lang="en"&gt;</text><rect x="130" y="205" width="780" height="175" rx="12" fill="#fff3e8" stroke="#c27a39" stroke-width="2"/><text x="160" y="240" class="l">&lt;head&gt;</text><rect x="175" y="255" width="690" height="42" rx="8" fill="#fff" stroke="#c27a39"/><text x="520" y="283" text-anchor="middle" class="l">&lt;meta ...&gt; page settings</text><rect x="175" y="310" width="690" height="42" rx="8" fill="#fff" stroke="#c27a39"/><text x="520" y="338" text-anchor="middle" class="l">&lt;title&gt;My First Website&lt;/title&gt;</text><text x="160" y="368" class="s">Page information (not the main visible content)</text><rect x="130" y="400" width="780" height="205" rx="12" fill="#e8f1e9" stroke="#43815a" stroke-width="2"/><text x="160" y="435" class="l">&lt;body&gt;</text><rect x="175" y="450" width="690" height="55" rx="8" fill="#fff" stroke="#43815a"/><text x="520" y="485" text-anchor="middle" class="l">&lt;h1&gt;Hello, World!&lt;/h1&gt;</text><rect x="175" y="515" width="690" height="55" rx="8" fill="#fff" stroke="#43815a"/><text x="520" y="550" text-anchor="middle" class="l">&lt;p&gt;I am learning HTML.&lt;/p&gt;</text><text x="160" y="590" class="s">Visible webpage content</text><text x="500" y="660" text-anchor="middle" class="s">Simplified diagram — indentation shows which elements are inside others.</text></svg>