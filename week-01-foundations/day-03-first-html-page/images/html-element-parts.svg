<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Parts of an HTML element</title><desc id="d">The paragraph element is split into opening tag, content, and closing tag.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.code{font-family:monospace;font-size:48px;font-weight:700}.l{font-size:22px;font-weight:700}.s{font-size:18px}</style></defs><rect width="1000" height="430" rx="22" fill="#f7f9fc"/><text x="500" y="58" text-anchor="middle" class="h">Parts of an HTML element</text><rect x="100" y="125" width="800" height="110" rx="16" fill="#fff" stroke="#526b89" stroke-width="3"/><text x="275" y="195" text-anchor="middle" class="code" fill="#245d91">&lt;p&gt;</text><text x="500" y="195" text-anchor="middle" class="code">Hello!</text><text x="735" y="195" text-anchor="middle" class="code" fill="#16724b">&lt;/p&gt;</text><path d="M275 240 V285 H275 V310 M500 240 V285 H500 V310 M735 240 V285 H735 V310" stroke="#526b89" stroke-width="3" fill="none"/><text x="275" y="350" text-anchor="middle" class="l">Opening tag</text><text x="500" y="350" text-anchor="middle" class="l">Content</text><text x="735" y="350" text-anchor="middle" class="l">Closing tag</text><text x="500" y="395" text-anchor="middle" class="s">Together, these parts make a paragraph element.</text></svg>