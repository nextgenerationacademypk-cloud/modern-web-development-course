<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Example website project folder</title><desc id="d">A folder tree showing my-first-website with index.html, images folder, and notes.txt.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.l{font-size:22px}.s{font-size:18px}</style></defs><rect width="1000" height="560" rx="22" fill="#f7f9fc"/><text x="500" y="55" text-anchor="middle" class="h">A simple website project folder</text><rect x="90" y="110" width="820" height="370" rx="18" fill="#fff" stroke="#526b89" stroke-width="3"/><g fill="none" stroke="#7b91aa" stroke-width="4"><path d="M170 180 V390 M170 235 H230 M170 310 H230 M170 385 H230"/></g><g><rect x="110" y="130" width="52" height="36" rx="5" fill="#f4c96b" stroke="#b8862c" stroke-width="2"/><text x="185" y="158" class="l">my-first-website/</text><rect x="230" y="205" width="44" height="30" rx="4" fill="#dce8f5" stroke="#52739b" stroke-width="2"/><text x="295" y="229" class="l">index.html</text><rect x="230" y="280" width="44" height="30" rx="4" fill="#f4c96b" stroke="#b8862c" stroke-width="2"/><text x="295" y="304" class="l">images/</text><rect x="230" y="355" width="44" height="30" rx="4" fill="#e8eaf0" stroke="#7b8795" stroke-width="2"/><text x="295" y="379" class="l">notes.txt</text></g><text x="500" y="435" text-anchor="middle" class="s">Keep the files for one website together in its project folder.</text></svg>