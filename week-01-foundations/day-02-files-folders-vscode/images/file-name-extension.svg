<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">File name and extension</title><desc id="d">The example index.html is divided into the file name index and extension html.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.big{font-size:62px;font-weight:700}.l{font-size:22px}.s{font-size:18px}</style></defs><rect width="1000" height="440" rx="22" fill="#f7f9fc"/><text x="500" y="58" text-anchor="middle" class="h">A file name has parts</text><rect x="245" y="120" width="510" height="110" rx="16" fill="#fff" stroke="#526b89" stroke-width="3"/><text x="430" y="193" text-anchor="middle" class="big" fill="#245d91">index</text><text x="565" y="193" text-anchor="middle" class="big">.</text><text x="660" y="193" text-anchor="middle" class="big" fill="#16724b">html</text><path d="M430 240 V285 H330 V315 M660 240 V285 H730 V315" stroke="#526b89" stroke-width="3" fill="none"/><text x="330" y="350" text-anchor="middle" class="l">File name</text><text x="330" y="380" text-anchor="middle" class="s">index</text><text x="730" y="350" text-anchor="middle" class="l">Extension</text><text x="730" y="380" text-anchor="middle" class="s">html — identifies the file type</text></svg>