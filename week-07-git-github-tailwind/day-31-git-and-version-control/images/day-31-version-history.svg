<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Simple version history</title><desc id="desc">A project changes over time and Git records meaningful commits as snapshots.</desc>
<rect width="900" height="300" rx="22" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<path d="M160 135 H740" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
<g fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"><circle cx="180" cy="135" r="48"/><circle cx="450" cy="135" r="48"/><circle cx="720" cy="135" r="48"/></g>
<g fill="#1e3a8a" font-size="19" font-weight="bold"><text x="180" y="130">Commit 1</text><text x="450" y="130">Commit 2</text><text x="720" y="130">Commit 3</text></g>
<g fill="#334155" font-size="15"><text x="180" y="157">First page</text><text x="450" y="157">Add CSS</text><text x="720" y="157">Fix layout</text></g>
<g fill="#475569" font-size="18"><text x="450" y="235">Git keeps a history of meaningful project snapshots.</text></g>
</g></svg>
