<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tailwind Card Demo</title>
  <!-- Classroom demonstration only. Follow the current official v4 Play CDN guide. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 p-6">
  <main class="mx-auto max-w-3xl">
    <h1 class="mb-6 text-2xl font-bold text-slate-800">Our Courses</h1>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <article class="rounded-xl bg-white p-6 shadow">
        <h2 class="text-xl font-bold text-slate-800">HTML and CSS</h2>
        <p class="mt-2 text-slate-600">Build the structure and design of webpages.</p>
        <a class="mt-4 inline-block rounded-lg bg-blue-600 px-4 py-2 text-white" href="#">Explore</a>
      </article>
      <article class="rounded-xl bg-white p-6 shadow">
        <h2 class="text-xl font-bold text-slate-800">JavaScript</h2>
        <p class="mt-2 text-slate-600">Add interaction to your webpages.</p>
        <a class="mt-4 inline-block rounded-lg bg-blue-600 px-4 py-2 text-white" href="#">Explore</a>
      </article>
    </div>
  </main>
</body>
</html>
