<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Tailwind utility groups</title><desc id="desc">Examples of utility groups for spacing, typography and colour, layout, and responsive behaviour.</desc>
<rect width="900" height="330" rx="22" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<g stroke="#0f766e" stroke-width="2"><rect x="25" y="65" width="195" height="170" rx="15" fill="#ccfbf1"/><rect x="245" y="65" width="195" height="170" rx="15" fill="#dbeafe" stroke="#1d4ed8"/><rect x="465" y="65" width="195" height="170" rx="15" fill="#fef3c7" stroke="#b45309"/><rect x="685" y="65" width="190" height="170" rx="15" fill="#f3e8ff" stroke="#7e22ce"/></g>
<g font-size="19" font-weight="bold"><text x="122" y="108" fill="#134e4a">Spacing</text><text x="342" y="108" fill="#1e3a8a">Typography</text><text x="562" y="108" fill="#78350f">Layout</text><text x="780" y="108" fill="#581c87">Responsive</text></g>
<g font-size="16" fill="#334155"><text x="122" y="148">p-4 · m-2 · gap-4</text><text x="342" y="148">text-xl · font-bold</text><text x="342" y="178">text-slate-700</text><text x="562" y="148">flex · grid · items-center</text><text x="780" y="148">sm: · md: · lg:</text><text x="780" y="178">breakpoint variants</text></g>
<text x="450" y="280" font-size="18" fill="#475569">Each utility applies a small styling choice that maps to CSS concepts.</text>
</g></svg>
