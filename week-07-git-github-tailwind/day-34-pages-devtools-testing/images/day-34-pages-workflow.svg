<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">GitHub Pages publishing workflow</title><desc id="desc">Commit and push static website files, configure GitHub Pages, wait for deployment, then test the published website.</desc>
<rect width="900" height="300" rx="22" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<g fill="#ede9fe" stroke="#6d28d9" stroke-width="2"><rect x="25" y="85" width="185" height="105" rx="15"/><rect x="245" y="85" width="185" height="105" rx="15"/><rect x="465" y="85" width="185" height="105" rx="15"/><rect x="685" y="85" width="190" height="105" rx="15"/></g>
<g fill="#4c1d95" font-size="19" font-weight="bold"><text x="117" y="127">Commit + push</text><text x="337" y="127">Configure Pages</text><text x="557" y="127">Deploy</text><text x="780" y="127">Test live site</text></g>
<g fill="#334155" font-size="15"><text x="117" y="155">Send files to GitHub</text><text x="337" y="155">Choose branch/folder</text><text x="557" y="155">Wait for publication</text><text x="780" y="155">Check links + layout</text></g>
<g stroke="#64748b" stroke-width="3" fill="none"><path d="M210 137 H240 l-8 -8 m8 8 l-8 8"/><path d="M430 137 H460 l-8 -8 m8 8 l-8 8"/><path d="M650 137 H680 l-8 -8 m8 8 l-8 8"/></g>
<text x="450" y="245" font-size="18" fill="#475569">GitHub Pages hosts static files; it is not a server-side application host.</text>
</g></svg>
