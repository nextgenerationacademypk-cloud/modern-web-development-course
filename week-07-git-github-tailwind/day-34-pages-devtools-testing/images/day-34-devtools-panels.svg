<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Chrome DevTools panels</title><desc id="desc">The Elements panel inspects HTML and CSS, Console shows JavaScript messages and errors, and Device Mode tests responsive widths.</desc>
<rect width="900" height="330" rx="22" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<g stroke="#0f766e" stroke-width="2"><rect x="35" y="65" width="250" height="165" rx="15" fill="#ccfbf1"/><rect x="325" y="65" width="250" height="165" rx="15" fill="#dbeafe" stroke="#1d4ed8"/><rect x="615" y="65" width="250" height="165" rx="15" fill="#fef3c7" stroke="#b45309"/></g>
<g font-size="22" font-weight="bold"><text x="160" y="112" fill="#134e4a">Elements</text><text x="450" y="112" fill="#1e3a8a">Console</text><text x="740" y="112" fill="#78350f">Device Mode</text></g>
<g font-size="16" fill="#334155"><text x="160" y="150">Inspect HTML + CSS</text><text x="160" y="178">Try temporary styles</text><text x="450" y="150">Read messages</text><text x="450" y="178">Find JavaScript errors</text><text x="740" y="150">Test narrow screens</text><text x="740" y="178">Check responsive layout</text></g>
<text x="450" y="280" font-size="18" fill="#475569">DevTools helps you investigate; save real fixes in your source files.</text>
</g></svg>
