<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Learning Gallery</h1>
    <p>Resize the browser. The grid will fit as many cards as the available space allows.</p>
    <section class="gallery" aria-label="Learning gallery">
      <article class="card"><img src="../images/web-design.svg" alt="Placeholder image for web design"><h2>Web Design</h2><p>Plan and style useful pages.</p></article>
      <article class="card"><img src="../images/html.svg" alt="Placeholder image for HTML"><h2>HTML</h2><p>Structure web content clearly.</p></article>
      <article class="card"><img src="../images/css.svg" alt="Placeholder image for CSS"><h2>CSS</h2><p>Style layouts and components.</p></article>
      <article class="card"><img src="../images/practice.svg" alt="Placeholder image for coding practice"><h2>Practice</h2><p>Learn by building small projects.</p></article>
    </section>
  </main>
</body>
</html>
