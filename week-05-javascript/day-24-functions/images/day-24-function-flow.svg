<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Function input and output</title><desc id="d">A function receives input values, performs work, and returns a result.</desc><rect width="900" height="300" rx="18" fill="#f3f6fb"/><g font-family="Arial" text-anchor="middle"><rect x="55" y="85" width="220" height="130" rx="14" fill="#e6f4fb" stroke="#2877b9" stroke-width="4"/><text x="165" y="135" font-size="27" font-weight="bold" fill="#202938">Input</text><text x="165" y="175" font-size="20" fill="#202938">Arguments</text><rect x="340" y="85" width="220" height="130" rx="14" fill="#dbe7f5" stroke="#315f89" stroke-width="4"/><text x="450" y="135" font-size="27" font-weight="bold" fill="#202938">Function</text><text x="450" y="175" font-size="20" fill="#202938">Do the task</text><rect x="625" y="85" width="220" height="130" rx="14" fill="#eaf5ed" stroke="#3d8055" stroke-width="4"/><text x="735" y="135" font-size="27" font-weight="bold" fill="#202938">Output</text><text x="735" y="175" font-size="20" fill="#202938">Return value</text></g><g stroke="#52677f" stroke-width="5" fill="none"><path d="M280 150h55m-12-12 12 12-12 12M565 150h55m-12-12 12 12-12 12"/></g></svg>