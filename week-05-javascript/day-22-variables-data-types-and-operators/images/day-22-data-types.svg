<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">JavaScript basic data types</title><desc id="d">Examples of string, number, and boolean values.</desc><rect width="900" height="300" rx="18" fill="#f3f6fb"/><g font-family="Arial" text-anchor="middle"><g><rect x="70" y="65" width="230" height="170" rx="14" fill="#fff0e6" stroke="#c65b28" stroke-width="4"/><text x="185" y="115" font-size="30" font-weight="bold" fill="#202938">String</text><text x="185" y="165" font-size="24" fill="#202938">"Hello"</text><text x="185" y="205" font-size="18" fill="#52677f">Text</text></g><g><rect x="335" y="65" width="230" height="170" rx="14" fill="#e6f4fb" stroke="#2877b9" stroke-width="4"/><text x="450" y="115" font-size="30" font-weight="bold" fill="#202938">Number</text><text x="450" y="165" font-size="24" fill="#202938">42</text><text x="450" y="205" font-size="18" fill="#52677f">Numeric value</text></g><g><rect x="600" y="65" width="230" height="170" rx="14" fill="#eaf5ed" stroke="#3d8055" stroke-width="4"/><text x="715" y="115" font-size="30" font-weight="bold" fill="#202938">Boolean</text><text x="715" y="165" font-size="24" fill="#202938">true / false</text><text x="715" y="205" font-size="18" fill="#52677f">Yes or no value</text></g></g></svg>