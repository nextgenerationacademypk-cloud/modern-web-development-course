<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d"><title id="t">Condition decision flow</title><desc id="d">A condition leads to one of two branches depending on whether it is true or false.</desc><rect width="900" height="340" rx="18" fill="#f3f6fb"/><rect x="325" y="35" width="250" height="70" rx="12" fill="#dbe7f5" stroke="#315f89" stroke-width="4"/><text x="450" y="78" font-family="Arial" font-size="25" text-anchor="middle" fill="#202938">Check condition</text><path d="M450 105v45M450 150H230v45M450 150h220v45" fill="none" stroke="#52677f" stroke-width="4"/><path d="m218 185 12 12 12-12M658 185l12 12 12-12" fill="none" stroke="#52677f" stroke-width="4"/><rect x="105" y="200" width="250" height="85" rx="12" fill="#eaf5ed" stroke="#3d8055" stroke-width="4"/><rect x="545" y="200" width="250" height="85" rx="12" fill="#fff0e6" stroke="#c65b28" stroke-width="4"/><g font-family="Arial" font-size="25" text-anchor="middle" fill="#202938"><text x="230" y="235">True</text><text x="230" y="265">Run if block</text><text x="670" y="235">False</text><text x="670" y="265">Run else block</text></g></svg>