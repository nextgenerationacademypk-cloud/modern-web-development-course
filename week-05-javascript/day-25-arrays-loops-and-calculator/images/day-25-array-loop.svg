<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="t d"><title id="t">Array indexes and loop</title><desc id="d">An array with three items at indexes zero, one, and two is visited in order by a loop.</desc><rect width="900" height="320" rx="18" fill="#f3f6fb"/><g font-family="Arial" text-anchor="middle"><text x="450" y="45" font-size="26" fill="#202938">Array items and indexes</text><g fill="#dbe7f5" stroke="#315f89" stroke-width="3"><rect x="160" y="80" width="170" height="85" rx="10"/><rect x="365" y="80" width="170" height="85" rx="10"/><rect x="570" y="80" width="170" height="85" rx="10"/></g><g font-size="23" fill="#202938"><text x="245" y="130">HTML</text><text x="450" y="130">CSS</text><text x="655" y="130">JavaScript</text><text x="245" y="195" font-size="18">Index 0</text><text x="450" y="195" font-size="18">Index 1</text><text x="655" y="195" font-size="18">Index 2</text></g><rect x="290" y="235" width="320" height="55" rx="12" fill="#eaf5ed" stroke="#3d8055" stroke-width="3"/><text x="450" y="270" font-size="22" fill="#202938">Loop visits each item</text></g></svg>