<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Flexbox parent and child items</title><desc id="desc">A flex container parent holds three flex item cards in a row with a gap between them.</desc><rect width="900" height="390" rx="20" fill="#f4f7fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1d3557">Flexbox: parent and child items</text><rect x="85" y="105" width="730" height="210" rx="18" fill="#e5efff" stroke="#4776b8" stroke-width="3"/><text x="450" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17406e">Parent: display: flex; gap: 18px;</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="125" y="175" width="190" height="100" rx="12" fill="#fff" stroke="#6d8eb8" stroke-width="2"/><text x="220" y="230" font-size="22" fill="#17365d">Item 1</text><rect x="355" y="175" width="190" height="100" rx="12" fill="#fff" stroke="#6d8eb8" stroke-width="2"/><text x="450" y="230" font-size="22" fill="#17365d">Item 2</text><rect x="585" y="175" width="190" height="100" rx="12" fill="#fff" stroke="#6d8eb8" stroke-width="2"/><text x="680" y="230" font-size="22" fill="#17365d">Item 3</text></g><text x="450" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#34465a">Apply Flexbox to the parent that contains the items.</text></svg>