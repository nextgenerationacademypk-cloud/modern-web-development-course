<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Flexbox container and items</title><desc id="desc">A flex container parent holds three flex item cards arranged in a row with gaps.</desc><rect width="900" height="390" rx="20" fill="#f4f7fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17365d">Flexbox: parent and children</text><rect x="85" y="105" width="730" height="205" rx="18" fill="#e4efff" stroke="#4e7eb5" stroke-width="3"/><text x="450" y="140" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#174a7e">Flex container (parent with display: flex)</text><g font-family="Arial" text-anchor="middle"><rect x="130" y="175" width="175" height="95" rx="12" fill="#fff" stroke="#4e7eb5" stroke-width="2"/><rect x="363" y="175" width="175" height="95" rx="12" fill="#fff" stroke="#4e7eb5" stroke-width="2"/><rect x="596" y="175" width="175" height="95" rx="12" fill="#fff" stroke="#4e7eb5" stroke-width="2"/><g font-size="21" font-weight="bold" fill="#17365d"><text x="217" y="230">Item 1</text><text x="450" y="230">Item 2</text><text x="683" y="230">Item 3</text></g></g><text x="450" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#34465a">Direct children become flex items. The gap adds space between them.</text></svg>