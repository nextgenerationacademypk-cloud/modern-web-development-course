<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">CSS selector types</title><desc id="desc">Three panels compare element, class, and ID selectors and show matching HTML examples.</desc><rect width="960" height="390" rx="20" fill="#f5f7fb"/><text x="480" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17365d">Three common CSS selectors</text><g font-family="Arial"><rect x="35" y="90" width="280" height="240" rx="16" fill="#e6f0ff" stroke="#5484bd" stroke-width="2"/><rect x="340" y="90" width="280" height="240" rx="16" fill="#e8f5eb" stroke="#5a986b" stroke-width="2"/><rect x="645" y="90" width="280" height="240" rx="16" fill="#f1eafa" stroke="#896bb2" stroke-width="2"/><g text-anchor="middle"><text x="175" y="135" font-size="23" font-weight="bold" fill="#174a7e">Element</text><text x="175" y="195" font-family="monospace" font-size="25" fill="#174a7e">p</text><text x="175" y="245" font-family="monospace" font-size="18" fill="#243247">&lt;p&gt;Text&lt;/p&gt;</text><text x="480" y="135" font-size="23" font-weight="bold" fill="#27623a">Class</text><text x="480" y="195" font-family="monospace" font-size="25" fill="#27623a">.notice</text><text x="480" y="245" font-family="monospace" font-size="18" fill="#243247">class="notice"</text><text x="785" y="135" font-size="23" font-weight="bold" fill="#593b83">ID</text><text x="785" y="195" font-family="monospace" font-size="25" fill="#593b83">#header</text><text x="785" y="245" font-family="monospace" font-size="18" fill="#243247">id="header"</text></g><text x="480" y="365" text-anchor="middle" font-family="Arial" font-size="18" fill="#34465a">Use classes for reusable styles. Keep each ID unique on the page.</text></g></svg>