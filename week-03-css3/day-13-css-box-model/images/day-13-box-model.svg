<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">CSS box model layers</title><desc id="desc">Nested rectangles show margin outside border, padding inside border, and content at the center.</desc><rect width="900" height="430" rx="20" fill="#f5f7fb"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17365d">CSS box model: outside to inside</text><rect x="170" y="85" width="560" height="300" rx="14" fill="#f7e3c4" stroke="#bd8435" stroke-width="3"/><rect x="235" y="135" width="430" height="210" rx="10" fill="#d9e8f7" stroke="#4c79a7" stroke-width="3"/><rect x="300" y="180" width="300" height="120" rx="8" fill="#d9f0df" stroke="#4c8b5d" stroke-width="3"/><rect x="355" y="210" width="190" height="60" rx="6" fill="#fff" stroke="#7892aa" stroke-width="2"/><g font-family="Arial" font-size="21" font-weight="bold" text-anchor="middle"><text x="450" y="115" fill="#86520e">MARGIN</text><text x="450" y="165" fill="#244d73">BORDER</text><text x="450" y="205" fill="#27623a">PADDING</text><text x="450" y="247" fill="#17365d">CONTENT</text></g><text x="450" y="410" text-anchor="middle" font-family="Arial" font-size="17" fill="#34465a">Padding is inside the border. Margin is outside the border.</text></svg>