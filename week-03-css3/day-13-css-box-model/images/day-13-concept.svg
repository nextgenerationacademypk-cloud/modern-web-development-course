<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">CSS box model layers</title><desc id="desc">Nested rectangles show margin outside border, padding inside border, and content in the centre.</desc><rect width="900" height="390" rx="20" fill="#f6f7fb"/><text x="450" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1d3557">The CSS box model</text><rect x="190" y="80" width="520" height="270" fill="#f9dfdf" stroke="#b95d5d" stroke-width="3"/><text x="215" y="110" font-family="Arial,sans-serif" font-size="20" fill="#7b3030">MARGIN</text><rect x="270" y="125" width="360" height="195" fill="#f9edc9" stroke="#bd9239" stroke-width="3"/><text x="292" y="155" font-family="Arial,sans-serif" font-size="20" fill="#78530e">BORDER</text><rect x="340" y="175" width="220" height="105" fill="#dcefe1" stroke="#43865a" stroke-width="3"/><text x="450" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#205b35">PADDING</text><rect x="390" y="220" width="120" height="40" fill="#dceafe" stroke="#4776b8" stroke-width="2"/><text x="450" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#17365d">CONTENT</text></svg>