<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Academy information page wireframe</title><desc id="desc">A simple website wireframe with header and navigation, welcome section, three course cards, about section, and footer.</desc><rect width="900" height="560" rx="20" fill="#f5f7fb"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17365d">Week 3 academy page plan</text><g font-family="Arial" text-anchor="middle"><rect x="95" y="75" width="710" height="65" rx="10" fill="#dce9f8" stroke="#527eac" stroke-width="2"/><text x="450" y="115" font-size="21" font-weight="bold" fill="#17365d">HEADER + NAVIGATION</text><rect x="95" y="155" width="710" height="95" rx="10" fill="#e8f3eb" stroke="#5b9469" stroke-width="2"/><text x="450" y="210" font-size="22" font-weight="bold" fill="#205b35">WELCOME SECTION</text><rect x="95" y="265" width="710" height="130" rx="10" fill="#fff0dc" stroke="#c18b3d" stroke-width="2"/><text x="450" y="292" font-size="20" font-weight="bold" fill="#79500e">COURSES</text><rect x="125" y="310" width="190" height="65" rx="8" fill="#fff" stroke="#c18b3d"/><rect x="355" y="310" width="190" height="65" rx="8" fill="#fff" stroke="#c18b3d"/><rect x="585" y="310" width="190" height="65" rx="8" fill="#fff" stroke="#c18b3d"/><g font-size="17" fill="#79500e"><text x="220" y="350">Course 1</text><text x="450" y="350">Course 2</text><text x="680" y="350">Course 3</text></g><rect x="95" y="410" width="710" height="65" rx="10" fill="#eee8f8" stroke="#8068aa" stroke-width="2"/><text x="450" y="450" font-size="21" font-weight="bold" fill="#493477">ABOUT SECTION</text><rect x="95" y="490" width="710" height="45" rx="10" fill="#dce3eb" stroke="#71869b" stroke-width="2"/><text x="450" y="520" font-size="19" font-weight="bold" fill="#34465a">FOOTER</text></g></svg>