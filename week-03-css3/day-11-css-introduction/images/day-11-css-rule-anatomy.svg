<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">CSS rule anatomy</title><desc id="desc">A CSS rule with labels for selector, declaration, property, and value.</desc><rect width="900" height="360" rx="20" fill="#f4f7fb"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17365d">Parts of a CSS rule</text><rect x="95" y="105" width="710" height="150" rx="16" fill="#fff" stroke="#8ba5c4" stroke-width="2"/><g font-family="monospace" font-size="30" fill="#17365d"><text x="145" y="165">h1</text><text x="205" y="165">{</text><text x="245" y="210">color: blue;</text><text x="205" y="245">}</text></g><g font-family="Arial" font-size="18" font-weight="bold"><text x="145" y="90" fill="#2366a8">Selector</text><path d="M165 95 L165 130" stroke="#2366a8" stroke-width="2"/><text x="360" y="290" fill="#23804b">Property</text><path d="M410 270 L410 225" stroke="#23804b" stroke-width="2"/><text x="520" y="290" fill="#a35c13">Value</text><path d="M555 270 L555 225" stroke="#a35c13" stroke-width="2"/><text x="700" y="90" fill="#6c4aa1">Declaration</text><path d="M730 95 L730 180" stroke="#6c4aa1" stroke-width="2"/></g></svg>