<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Parts of an HTML link</title><desc id="desc">An anchor element with an href destination and visible link text.</desc>
<rect width="900" height="500" rx="24" fill="#f8fafc"/><text x="48" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">Parts of an HTML link</text>
<rect x="55" y="112" width="790" height="132" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="88" y="158" font-family="monospace" font-size="26" fill="#0f172a">&lt;a href="https://developer.mozilla.org"&gt;</text><text x="145" y="205" font-family="monospace" font-size="27" font-weight="700" fill="#1d4ed8">Read MDN Web Docs</text><text x="88" y="232" font-family="monospace" font-size="26" fill="#0f172a">&lt;/a&gt;</text>
<path d="M390 105 V82 H545" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="545" y="65" width="280" height="42" rx="10" fill="#dbeafe"/><text x="560" y="92" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">href = destination address</text>
<path d="M340 207 V286 H210" stroke="#16a34a" stroke-width="3" fill="none"/><rect x="55" y="286" width="360" height="58" rx="12" fill="#dcfce7"/><text x="75" y="322" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#14532d">Visible text = what people click</text>
<rect x="470" y="286" width="375" height="112" rx="14" fill="#fef3c7"/><text x="492" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#78350f">Remember</text><text x="492" y="350" font-family="Arial,sans-serif" font-size="17" fill="#78350f">The href chooses the destination.</text><text x="492" y="376" font-family="Arial,sans-serif" font-size="17" fill="#78350f">The link text describes the destination.</text>
<text x="55" y="454" font-family="Arial,sans-serif" font-size="18" fill="#334155">Always click and test your links in the browser.</text></svg>