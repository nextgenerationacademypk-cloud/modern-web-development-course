<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable and Sample Form</title>
</head>
<body>
  <h1>Weekly Study Timetable</h1>
  <table>
    <caption>Example class plan</caption>
    <thead><tr><th scope="col">Day</th><th scope="col">Topic</th><th scope="col">Time</th></tr></thead>
    <tbody>
      <tr><th scope="row">Monday</th><td>HTML</td><td>9:00 AM</td></tr>
      <tr><th scope="row">Tuesday</th><td>Practice</td><td>9:00 AM</td></tr>
      <tr><th scope="row">Wednesday</th><td>Review</td><td>9:00 AM</td></tr>
    </tbody>
  </table>
  <h2>Sample Contact Form</h2>
  <form>
    <p><label for="name">Name</label><br><input id="name" name="name" type="text" required></p>
    <p><label for="email">Email</label><br><input id="email" name="email" type="email" required></p>
    <p><label for="message">Message</label><br><textarea id="message" name="message" rows="4"></textarea></p>
    <button type="submit">Submit sample form</button>
  </form>
  <p>This demonstration has no server. It does not send or store information.</p>
</body>
</html>
