<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Connecting form labels and controls</title><desc id="desc">A label for name has a for value that matches the input id. A required attribute marks the field as required.</desc>
<rect width="900" height="480" rx="24" fill="#f8fafc"/><text x="48" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">Connect each label to its control</text>
<rect x="65" y="105" width="770" height="265" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="105" y="160" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">Name</text><rect x="105" y="180" width="660" height="58" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="125" y="216" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Enter a sample name</text>
<path d="M210 166 V145 H350" stroke="#2563eb" stroke-width="3" fill="none"/><rect x="350" y="120" width="410" height="48" rx="9" fill="#dbeafe"/><text x="370" y="151" font-family="monospace" font-size="18" fill="#1e3a8a">label for="student-name"</text>
<path d="M430 238 V270 H570" stroke="#16a34a" stroke-width="3" fill="none"/><rect x="570" y="250" width="190" height="48" rx="9" fill="#dcfce7"/><text x="588" y="281" font-family="monospace" font-size="18" fill="#14532d">input id="student-name"</text>
<text x="105" y="335" font-family="monospace" font-size="19" fill="#78350f">required</text><text x="240" y="335" font-family="Arial,sans-serif" font-size="18" fill="#78350f">asks the browser to check that a value is entered</text>
<text x="65" y="425" font-family="Arial,sans-serif" font-size="18" fill="#334155">The label's for value and the control's id must match exactly. Use fictional practice details.</text></svg>