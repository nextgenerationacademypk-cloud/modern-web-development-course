<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Basic HTML table structure</title><desc id="desc">A timetable table with a caption, header row using th cells, and data rows using td cells.</desc>
<rect width="900" height="520" rx="24" fill="#f8fafc"/><text x="48" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">Basic HTML table structure</text>
<rect x="70" y="110" width="760" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="153" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">caption — Weekly class timetable</text>
<rect x="70" y="195" width="760" height="74" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M323 195 V455 M576 195 V455" stroke="#16a34a" stroke-width="2"/><text x="95" y="240" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14532d">th: Day</text><text x="350" y="240" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14532d">th: Subject</text><text x="600" y="240" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14532d">th: Room</text>
<rect x="70" y="269" width="760" height="93" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="95" y="325" font-family="Arial,sans-serif" font-size="20" fill="#334155">td: Monday</text><text x="350" y="325" font-family="Arial,sans-serif" font-size="20" fill="#334155">td: HTML</text><text x="600" y="325" font-family="Arial,sans-serif" font-size="20" fill="#334155">td: Lab 1</text>
<rect x="70" y="362" width="760" height="93" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="95" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334155">td: Tuesday</text><text x="350" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334155">td: CSS</text><text x="600" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334155">td: Lab 2</text>
<text x="70" y="490" font-family="Arial,sans-serif" font-size="18" fill="#334155">th describes a heading cell. td contains ordinary table data. Use tables for data, not page layout.</text></svg>