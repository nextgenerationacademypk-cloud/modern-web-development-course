<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">HTML heading hierarchy</title><desc id="desc">A page outline with one main heading, three section headings, a subsection, and paragraphs.</desc>
<rect width="900" height="520" rx="24" fill="#f7f9fc"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">HTML heading hierarchy</text>
<rect x="48" y="88" width="804" height="82" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="76" y="122" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">h1 — Main page heading</text><text x="76" y="150" font-family="Arial,sans-serif" font-size="17" fill="#1e3a8a">The main topic of this page (normally one clear h1)</text>
<path d="M90 170 V202 H140" stroke="#64748b" stroke-width="3" fill="none"/><rect x="140" y="190" width="680" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="166" y="222" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14532d">h2 — Section heading</text><text x="166" y="245" font-family="Arial,sans-serif" font-size="16" fill="#14532d">p — Paragraph explains this section</text>
<path d="M182 260 V286 H220" stroke="#64748b" stroke-width="3" fill="none"/><rect x="220" y="276" width="600" height="66" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="246" y="306" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#78350f">h3 — Subsection heading</text><text x="246" y="329" font-family="Arial,sans-serif" font-size="15" fill="#78350f">p — More detail about the subsection</text>
<path d="M90 170 V374 H140" stroke="#64748b" stroke-width="3" fill="none"/><rect x="140" y="360" width="680" height="62" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="166" y="397" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14532d">h2 — Another section heading</text>
<text x="48" y="472" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Choose headings for meaning and order — use CSS later to change their appearance.</text></svg>