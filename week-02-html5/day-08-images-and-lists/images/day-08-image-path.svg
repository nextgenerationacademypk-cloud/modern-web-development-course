<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">How an image path works</title><desc id="desc">A project folder containing index.html and an images folder with reading.svg. The HTML source points to images slash reading.svg.</desc>
<rect width="900" height="520" rx="24" fill="#f8fafc"/><text x="48" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172554">How an image path works</text>
<rect x="60" y="105" width="360" height="330" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="88" y="145" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">my-website/</text>
<rect x="105" y="175" width="275" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="130" y="216" font-family="monospace" font-size="22" fill="#1e3a8a">index.html</text>
<rect x="105" y="270" width="275" height="135" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="130" y="305" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14532d">images/</text><rect x="135" y="325" width="215" height="55" rx="8" fill="#fff" stroke="#16a34a"/><text x="155" y="360" font-family="monospace" font-size="19" fill="#14532d">reading.svg</text>
<path d="M380 210 C480 210 470 350 540 350" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M530 340 L545 350 L530 360" stroke="#2563eb" stroke-width="4" fill="none"/>
<rect x="550" y="275" width="300" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="575" y="315" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#78350f">HTML image source</text><text x="575" y="355" font-family="monospace" font-size="21" fill="#78350f">src="images/</text><text x="575" y="385" font-family="monospace" font-size="21" fill="#78350f">reading.svg"</text>
<text x="60" y="480" font-family="Arial,sans-serif" font-size="18" fill="#334155">The path starts from the folder that contains index.html. Match names and letter case exactly.</text></svg>