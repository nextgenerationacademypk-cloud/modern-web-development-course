<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Computer and file workflow</title>
<desc id="desc">A simple sequence showing a student opening a computer application, creating a project folder, creating a file, and saving the file in the folder.</desc>
<rect width="1000" height="430" rx="24" fill="#f4f7fb"/>
<text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Computer and file workflow</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="35" y="135" width="200" height="170" rx="18" fill="#dceafe" stroke="#4776b8" stroke-width="3"/>
<text x="135" y="195" font-size="23" font-weight="700" fill="#17365d">1. Open</text><text x="135" y="230" font-size="18" fill="#17365d">the computer</text><text x="135" y="258" font-size="18" fill="#17365d">application</text>
<path d="M240 220 H275 l-12 -10 m12 10 l-12 10" fill="none" stroke="#52657a" stroke-width="4" stroke-linecap="round"/>
<rect x="280" y="135" width="200" height="170" rx="18" fill="#e2f3e8" stroke="#47865c" stroke-width="3"/>
<text x="380" y="195" font-size="23" font-weight="700" fill="#205b35">2. Create</text><text x="380" y="230" font-size="18" fill="#205b35">a project</text><text x="380" y="258" font-size="18" fill="#205b35">folder</text>
<path d="M485 220 H520 l-12 -10 m12 10 l-12 10" fill="none" stroke="#52657a" stroke-width="4" stroke-linecap="round"/>
<rect x="525" y="135" width="200" height="170" rx="18" fill="#fff0d9" stroke="#c18a32" stroke-width="3"/>
<text x="625" y="195" font-size="23" font-weight="700" fill="#79500e">3. Create</text><text x="625" y="230" font-size="18" fill="#79500e">a file inside</text><text x="625" y="258" font-size="18" fill="#79500e">the folder</text>
<path d="M730 220 H765 l-12 -10 m12 10 l-12 10" fill="none" stroke="#52657a" stroke-width="4" stroke-linecap="round"/>
<rect x="770" y="135" width="195" height="170" rx="18" fill="#eee7fb" stroke="#8165b5" stroke-width="3"/>
<text x="867" y="195" font-size="23" font-weight="700" fill="#493477">4. Save</text><text x="867" y="230" font-size="18" fill="#493477">and find</text><text x="867" y="258" font-size="18" fill="#493477">your file</text>
<text x="500" y="365" font-size="20" fill="#34465a">Keep all files for one website together in one project folder.</text>
</g></svg>