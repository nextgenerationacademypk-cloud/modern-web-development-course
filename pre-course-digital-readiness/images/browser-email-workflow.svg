<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Browser and email workflow</title>
<desc id="desc">Two safe workflows: use the browser address bar to visit a trusted site, and use email to compose, check the recipient, and send a message safely.</desc>
<rect width="1000" height="430" rx="24" fill="#f7f8fa"/>
<text x="500" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172b4d">Browser and email: simple workflows</text>
<g font-family="Arial,sans-serif">
<rect x="45" y="95" width="435" height="275" rx="20" fill="#e8f1ff" stroke="#4776b8" stroke-width="3"/>
<text x="262" y="137" text-anchor="middle" font-size="25" font-weight="700" fill="#17365d">Using a browser</text>
<g text-anchor="middle" fill="#17365d" font-size="18">
<rect x="85" y="165" width="355" height="48" rx="10" fill="#fff" stroke="#7c9bc4"/><text x="262" y="196">1. Enter a trusted address or search</text>
<path d="M262 215 v20 m-8 -8 l8 8 l8 -8" fill="none" stroke="#4776b8" stroke-width="3"/>
<rect x="85" y="240" width="355" height="48" rx="10" fill="#fff" stroke="#7c9bc4"/><text x="262" y="271">2. Check the result and website address</text>
<path d="M262 290 v20 m-8 -8 l8 8 l8 -8" fill="none" stroke="#4776b8" stroke-width="3"/>
<rect x="85" y="315" width="355" height="38" rx="10" fill="#fff" stroke="#7c9bc4"/><text x="262" y="341">3. Open the page or link</text>
</g>
<rect x="520" y="95" width="435" height="275" rx="20" fill="#e9f6ed" stroke="#47865c" stroke-width="3"/>
<text x="737" y="137" text-anchor="middle" font-size="25" font-weight="700" fill="#205b35">Sending an email</text>
<g text-anchor="middle" fill="#205b35" font-size="18">
<rect x="560" y="165" width="355" height="48" rx="10" fill="#fff" stroke="#79a989"/><text x="737" y="196">1. Compose and add a subject</text>
<path d="M737 215 v20 m-8 -8 l8 8 l8 -8" fill="none" stroke="#47865c" stroke-width="3"/>
<rect x="560" y="240" width="355" height="48" rx="10" fill="#fff" stroke="#79a989"/><text x="737" y="271">2. Check the recipient and message</text>
<path d="M737 290 v20 m-8 -8 l8 8 l8 -8" fill="none" stroke="#47865c" stroke-width="3"/>
<rect x="560" y="315" width="355" height="38" rx="10" fill="#fff" stroke="#79a989"/><text x="737" y="341">3. Send only when it is correct</text>
</g>
</g></svg>