<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Events</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Event Practice</h1>
    <section class="panel">
      <h2>Counter</h2>
      <p id="count" class="number" aria-live="polite">0</p>
      <div class="controls">
        <button id="increase-button" type="button">Increase</button>
        <button id="decrease-button" type="button">Decrease</button>
        <button id="reset-button" type="button">Reset</button>
      </div>
    </section>
    <section class="panel">
      <h2>Live preview</h2>
      <label for="name-input">Type a sample name</label>
      <input id="name-input" type="text" placeholder="Your sample text">
      <p id="name-preview" aria-live="polite">Your text will appear here.</p>
    </section>
  </main>
</body>
</html>
