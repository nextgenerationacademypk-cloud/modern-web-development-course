<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">How a browser event works</title><desc id="desc">A user action triggers an event, the listener runs a function, and the function updates the page.</desc>
<rect width="900" height="300" rx="22" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<g stroke="#0f766e" stroke-width="2" fill="#ccfbf1"><rect x="25" y="80" width="185" height="115" rx="16"/><rect x="245" y="80" width="185" height="115" rx="16"/><rect x="465" y="80" width="185" height="115" rx="16"/><rect x="685" y="80" width="185" height="115" rx="16"/></g>
<g fill="#134e4a" font-size="20" font-weight="bold"><text x="117" y="125">User action</text><text x="337" y="125">Event</text><text x="557" y="125">Listener</text><text x="777" y="125">Page update</text></g>
<g fill="#334155" font-size="16"><text x="117" y="157">Click a button</text><text x="337" y="157">"click"</text><text x="557" y="157">Run a function</text><text x="777" y="157">Change text</text></g>
<g stroke="#64748b" stroke-width="3" fill="none"><path d="M210 137 H240 l-9 -8 m9 8 l-9 8"/><path d="M430 137 H460 l-9 -8 m9 8 l-9 8"/><path d="M650 137 H680 l-9 -8 m9 8 l-9 8"/></g>
</g></svg>
