<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Validation Practice</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Task Form Practice</h1>
    <p>This classroom form only displays feedback. It does not send or save information.</p>
    <form id="task-form">
      <label for="task-input">Enter a sample task</label>
      <input id="task-input" name="task" type="text" maxlength="60" autocomplete="off">
      <button type="submit">Check task</button>
    </form>
    <p id="form-message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
