<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">DOM practice project</p>
      <h1>My To-Do List</h1>
      <p>Add a task, then remove it when you are finished.</p>
    </header>

    <form id="task-form">
      <label for="task-input">New task</label>
      <div class="form-row">
        <input id="task-input" name="task" type="text" maxlength="80" autocomplete="off" placeholder="For example: Practise JavaScript">
        <button type="submit">Add task</button>
      </div>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <ul id="task-list" aria-label="Your tasks"></ul>
    <p class="note">Learning demo: tasks are temporary and disappear after you refresh this page.</p>
  </main>
</body>
</html>
