<g font-family="Arial, sans-serif" text-anchor="middle">
<g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="25" y="75" width="185" height="125" rx="16"/><rect x="245" y="75" width="185" height="125" rx="16"/><rect x="465" y="75" width="185" height="125" rx="16"/><rect x="685" y="75" width="185" height="125" rx="16"/></g>
<g fill="#1e3a8a" font-size="20" font-weight="bold"><text x="117" y="120">1. Create</text><text x="337" y="120">2. Set text</text><text x="557" y="120">3. Select parent</text><text x="777" y="120">4. Append</text></g>
<g fill="#334155" font-size="16"><text x="117" y="153">createElement("li")</text><text x="337" y="153">textContent = ...</text><text x="557" y="153">Find the ul</text><text x="777" y="153">appendChild(item)</text></g>
