<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changing DOM Elements</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1 id="heading">Update this page</h1>
    <p id="notice">This is the original message.</p>
    <img id="sample-photo" src="sample-photo.svg" alt="Placeholder landscape">
    <div class="controls">
      <button id="highlight-button" type="button">Toggle highlight</button>
      <button id="add-button" type="button">Add item</button>
      <button id="remove-button" type="button">Remove first item</button>
    </div>
    <ul id="task-list">
      <li id="old-task">Read the lesson</li>
    </ul>
  </main>
</body>
</html>
