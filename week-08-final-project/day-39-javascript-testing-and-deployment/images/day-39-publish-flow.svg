<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="t d"><title id="t">Publish workflow</title><desc id="d">Build and test, commit and push, publish and verify.</desc><rect width="900" height="250" rx="16" fill="#f4f7fb"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="24" fill="#183153">From local project to live website</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="85" width="225" height="105" rx="12" fill="#dcecff"/><text x="157" y="128" font-size="20" fill="#183153">Build + test</text><text x="157" y="156" font-size="14" fill="#183153">Browser and Console</text><path d="M280 137 H330 M318 125 L330 137 L318 149" stroke="#52657d" stroke-width="4" fill="none"/><rect x="340" y="85" width="220" height="105" rx="12" fill="#e4f4e8"/><text x="450" y="128" font-size="20" fill="#204b30">Commit + push</text><text x="450" y="156" font-size="14" fill="#204b30">Git to GitHub</text><path d="M570 137 H620 M608 125 L620 137 L608 149" stroke="#52657d" stroke-width="4" fill="none"/><rect x="630" y="85" width="225" height="105" rx="12" fill="#fff0d9"/><text x="742" y="128" font-size="20" fill="#68410e">Publish + verify</text><text x="742" y="156" font-size="14" fill="#68410e">GitHub Pages URL</text></g></svg>