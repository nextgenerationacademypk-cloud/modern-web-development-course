<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc"><title id="title">Final Project Planning and Wireframe workflow</title><desc id="desc">A three-step workflow: plan, build, and check.</desc><rect width="900" height="250" rx="18" fill="#f4f7fb"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#183153">Final Project Planning and Wireframe</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="88" width="220" height="105" rx="14" fill="#dcecff" stroke="#3976b9" stroke-width="2"/><text x="165" y="132" font-size="22" font-weight="bold" fill="#183153">1. Plan</text><text x="165" y="160" font-size="14" fill="#183153">Know the next step</text><path d="M290 140 H340 M328 128 L340 140 L328 152" stroke="#52657d" stroke-width="4" fill="none"/><rect x="350" y="88" width="200" height="105" rx="14" fill="#e4f4e8" stroke="#43865a" stroke-width="2"/><text x="450" y="132" font-size="22" font-weight="bold" fill="#204b30">2. Build</text><text x="450" y="160" font-size="14" fill="#204b30">Work in small steps</text><path d="M565 140 H615 M603 128 L615 140 L603 152" stroke="#52657d" stroke-width="4" fill="none"/><rect x="625" y="88" width="220" height="105" rx="14" fill="#fff0d9" stroke="#b67a24" stroke-width="2"/><text x="735" y="132" font-size="22" font-weight="bold" fill="#68410e">3. Check</text><text x="735" y="160" font-size="14" fill="#68410e">Test and improve</text></g></svg>