<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="t d"><title id="t">Final project planning</title><desc id="d">A plan with purpose, audience, four sections, and two interactions.</desc><rect width="900" height="260" rx="16" fill="#f4f7fb"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="24" fill="#183153">Plan before you code</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="78" width="185" height="125" rx="12" fill="#dcecff"/><text x="127" y="122" font-size="19" fill="#183153">Purpose</text><text x="127" y="151" font-size="14" fill="#183153">Why does it exist?</text><rect x="245" y="78" width="185" height="125" rx="12" fill="#e4f4e8"/><text x="337" y="122" font-size="19" fill="#204b30">Audience</text><text x="337" y="151" font-size="14" fill="#204b30">Who will use it?</text><rect x="455" y="78" width="200" height="125" rx="12" fill="#fff0d9"/><text x="555" y="118" font-size="18" fill="#68410e">Four sections</text><text x="555" y="147" font-size="13" fill="#68410e">Home · About · Services · Contact</text><rect x="680" y="78" width="185" height="125" rx="12" fill="#eee6fa"/><text x="772" y="122" font-size="19" fill="#49356a">Two features</text><text x="772" y="151" font-size="14" fill="#49356a">Use known patterns</text></g></svg>