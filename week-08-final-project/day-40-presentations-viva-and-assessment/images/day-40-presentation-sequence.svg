<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="t d"><title id="t">Final presentation sequence</title><desc id="d">Introduce, demonstrate, explain, and submit.</desc><rect width="900" height="250" rx="16" fill="#f4f7fb"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="24" fill="#183153">A clear project presentation</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="85" width="190" height="105" rx="12" fill="#dcecff"/><text x="130" y="130" font-size="20" fill="#183153">1. Introduce</text><text x="130" y="158" font-size="14" fill="#183153">Purpose + audience</text><rect x="250" y="85" width="190" height="105" rx="12" fill="#e4f4e8"/><text x="345" y="130" font-size="20" fill="#204b30">2. Demonstrate</text><text x="345" y="158" font-size="14" fill="#204b30">Sections + features</text><rect x="465" y="85" width="190" height="105" rx="12" fill="#fff0d9"/><text x="560" y="130" font-size="20" fill="#68410e">3. Explain</text><text x="560" y="158" font-size="14" fill="#68410e">Code + challenge</text><rect x="680" y="85" width="190" height="105" rx="12" fill="#eee6fa"/><text x="775" y="130" font-size="20" fill="#49356a">4. Submit</text><text x="775" y="158" font-size="14" fill="#49356a">Repo + live URL</text></g></svg>